services:
  envoy-mcp-openapi-processor:
    image: envoy-mcp-openapi-processor:latest
    build:
      context: ../..
      dockerfile: examples/mcp-server/Dockerfile
    volumes:
      - shared-uds:/var/run/shared
      - "../../testdata/petstore.openapi.yaml:/home/app/conf/openapi/petstore.openapi.yaml:ro"
    depends_on:
      - prism
  envoy:
    image: envoyproxy/envoy:distroless-v1.39.0
    user: "10042"
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - shared-uds:/var/run/shared
      - "./envoy-mcp.yaml:/etc/envoy/envoy-mcp.yaml:ro"
    command: ["--config-path", "/etc/envoy/envoy-mcp.yaml", "--log-level", "info"]
    depends_on:
      - envoy-mcp-openapi-processor
  prism:
    image: stoplight/prism:5.15.10
    command:
      - "mock"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false" # workaround for https://github.com/stoplightio/prism/issues/2763
      - "-p"
      - "8080"
      - "/openapi/petstore.openapi.yaml"
    volumes:
      - "../../testdata/petstore.openapi.yaml:/openapi/petstore.openapi.yaml:ro"
  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.2.0
    command: ["--web", "--config", "/home/node/mcp-catalog.json"]
    ports:
      - "127.0.0.1:6274:6274"
    environment:
      DANGEROUSLY_OMIT_AUTH: "true"
    volumes:
      - "./mcp-catalog.json:/home/node/mcp-catalog.json:ro"

volumes:
  shared-uds:
